services:
  mysql:
    image: mysql:8.0
    container_name: dataquery-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dataquery_agent
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./app/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./app/db/sample_data.sql:/docker-entrypoint-initdb.d/02-sample-data.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  milvus:
    image: milvusdb/milvus:v2.5.6
    container_name: dataquery-milvus
    environment:
      ETCD_USE_EMBED: "true"
      COMMON_STORAGETYPE: local
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    command: ["milvus", "run", "standalone"]

volumes:
  mysql_data:
  milvus_data:
