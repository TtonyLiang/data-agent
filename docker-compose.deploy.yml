services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # The deployment image uses the local Lite file by default.  To use an
      # existing Milvus service, set WENQU_DEPLOY_MILVUS_URI to its reachable URL.
      MILVUS_URI: ${WENQU_DEPLOY_MILVUS_URI:-./data/milvus.db}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - wenqu_data:/app/data
      - wenqu_logs:/app/logs
    ports:
      - "${BACKEND_PORT:-4400}:4400"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-4399}:80"
    restart: unless-stopped

volumes:
  wenqu_data:
  wenqu_logs:
