<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Analyst Studio QA Comparison</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 24px;
        background: #f4f6fb;
        color: #172033;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      h1 {
        margin: 0 0 18px;
        font-size: 20px;
        line-height: 1.3;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
        align-items: start;
      }
      .panel {
        background: #fff;
        border: 1px solid #dbe3f0;
        border-radius: 8px;
        overflow: hidden;
      }
      .label {
        padding: 10px 12px;
        border-bottom: 1px solid #dbe3f0;
        font-size: 13px;
        font-weight: 700;
      }
      img {
        display: block;
        width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <h1>Analyst Studio: Source Design vs Implementation</h1>
    <div class="grid">
      <section class="panel">
        <div class="label">Source ImageGen Option 2</div>
        <img src="analyst-studio-source.png" alt="Source design" />
      </section>
      <section class="panel">
        <div class="label">Rendered Implementation</div>
        <img src="analyst-studio-implementation.png" alt="Implementation screenshot" />
      </section>
    </div>
  </body>
</html>
